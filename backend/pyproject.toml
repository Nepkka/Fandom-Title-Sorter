[project]
name = "fts"
version = "0.1.0"
description = "FandomTitleSorter v2 — сортировщик артов по фандомам"
requires-python = ">=3.15"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
